name: E2E

on:
  push:
    branches: [main, developer]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: revoar
          POSTGRES_PASSWORD: revoar
          POSTGRES_DB: revoar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U revoar -d revoar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://revoar:revoar@localhost:5432/revoar?schema=public
      JWT_PARTNER_SECRET: ci-partner-secret
      JWT_ADMIN_SECRET: ci-admin-secret
      AWS_S3_ENDPOINT: http://localhost:4566
      AWS_S3_BUCKET: revoar-hotel-images
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: sa-east-1
      EXTRANET_URL: http://localhost:3000
      ADMIN_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Start LocalStack
        run: |
          docker run -d --name localstack -p 4566:4566 -e SERVICES=s3 localstack/localstack:4
          sleep 15

      - name: Install dependencies
        run: npm ci

      - name: Database setup
        run: |
          npm run db:generate
          npm run db:migrate
          npm run db:seed

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e
