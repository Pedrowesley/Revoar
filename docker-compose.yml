services:
  postgres:
    image: postgres:16-alpine
    container_name: revoar-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: revoar
      POSTGRES_PASSWORD: revoar
      POSTGRES_DB: revoar
    volumes:
      - revoar_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revoar -d revoar"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:4
    container_name: revoar-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEFAULT_REGION: sa-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - revoar_localstack:/var/lib/localstack

volumes:
  revoar_pg_data:
  revoar_localstack:
